<app-loader />
<app-toast />

<!-- Mobile overlay -->
@if (mobileOpen()) {
  <div class="mob-overlay" (click)="mobileOpen.set(false)"></div>
}

<!-- Sidebar -->
<app-sidebar
  [collapsed]="collapsed()"
  [mobileOpen]="mobileOpen()"
  (navClicked)="onNavClick()">
</app-sidebar>

<!-- Main content -->
<div class="main-wrap" [class.main-wrap--collapsed]="collapsed()">
  <app-navbar
    [pageTitle]="pageTitle()"
    (sidebarToggled)="toggleSidebar()">
  </app-navbar>
  <main class="main-page">
    <router-outlet />
  </main>
  <app-footer />
</div>
