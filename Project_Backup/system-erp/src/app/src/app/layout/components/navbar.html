<header class="topbar">

  <!-- Left -->
  <div class="topbar__left">
    <div class="toggle-btn" (click)="sidebarToggled.emit()">
      <i class="bi bi-list"></i>
    </div>
    <div class="topbar-title">{{ pageTitle }}</div>
  </div>

  <!-- Right -->
  <div class="topbar__right">

    <!-- Tenant badge -->
    <span class="tenant-badge">
      <i class="bi bi-building me-1"></i>
      {{ auth.currentUser()?.company_name }}
    </span>

    <!-- User dropdown -->
    <div class="user-dropdown" (click)="toggleMenu()">
      <div class="avatar-sm">{{ getInitials(auth.userName()) }}</div>
      <div class="user-meta d-none d-md-flex flex-column">
        <span class="user-name-sm">{{ auth.userName() }}</span>
        <small class="user-role-sm">{{ auth.userRole()?.toLowerCase() | titlecase }}</small>
      </div>
      <i class="bi bi-chevron-down ms-2" style="font-size:11px;color:#94a3b8"></i>

      @if (menuOpen()) {
        <div class="dropdown-menu-custom">
          <div class="dropdown-header">
            <div style="font-weight:600;font-size:14px">
              {{ auth.userName() }}
            </div>
            <div style="font-size:12px;color:#64748b">
              {{ auth.userRole()?.toLowerCase() | titlecase }}
            </div>
          </div>
          <div class="dropdown-divider"></div>
          
          <a *ngIf="perm.hasPermission('settings:view')"
            class="dropdown-item-custom"
            routerLink="/settings"
            (click)="menuOpen.set(false)">
            <i class="bi bi-gear"></i>
            Settings
          </a>
          
          <a *ngIf="perm.hasPermission('reports:view')"
            class="dropdown-item-custom"
            routerLink="/finance/reports"
            (click)="menuOpen.set(false)">
            <i class="bi bi-file-earmark-bar-graph"></i>
            Reports
          </a>
          <div class="dropdown-divider"></div>
          <button
            class="dropdown-item-custom text-danger-item"
            (click)="onLogout()">
            <i class="bi bi-box-arrow-right"></i>
            Sign Out
          </button>
        </div>
      }
    </div>

  </div>
</header>
